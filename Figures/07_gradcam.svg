<svg width="100%" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Panel 7 — Grad-CAM explainability</title>
<rect x="4" y="4" width="312" height="212" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="4" y="4" width="312" height="36" rx="12" fill="#D85A30"/>
<rect x="4" y="28" width="312" height="12" fill="#D85A30"/>
<circle cx="24" cy="22" r="12" fill="#712B13"/>
<text x="24" y="22" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="white" font-family="sans-serif">7</text>
<text x="165" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="white" font-family="sans-serif">Grad-CAM Explainability</text>

<!-- eye / heatmap icon -->
<ellipse cx="80" cy="85" rx="50" ry="30" fill="#F5C4B3" stroke="#D85A30" stroke-width="1"/>
<circle cx="80" cy="85" r="16" fill="#EF9F27"/>
<circle cx="80" cy="85" r="8" fill="#D85A30"/>
<circle cx="80" cy="85" r="3" fill="#712B13"/>
<!-- heatmap rings -->
<ellipse cx="80" cy="97" rx="38" ry="10" fill="none" stroke="#F09595" stroke-width="1" opacity="0.7"/>
<ellipse cx="80" cy="102" rx="28" ry="6" fill="none" stroke="#85B7EB" stroke-width="1" opacity="0.5"/>

<!-- five letter heatmap examples -->
<!-- A -->
<rect x="10" y="128" width="52" height="52" rx="5" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
<rect x="14" y="132" width="44" height="44" rx="3" fill="none"/>
<text x="36" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#633806" font-family="sans-serif">A</text>
<!-- crossbar highlight -->
<rect x="17" y="152" width="38" height="6" rx="2" fill="#EF9F27" opacity="0.6"/>
<text x="36" y="192" text-anchor="middle" font-size="10" fill="#993C1D" font-family="sans-serif">crossbar</text>

<!-- E -->
<rect x="70" y="128" width="52" height="52" rx="5" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
<text x="96" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#633806" font-family="sans-serif">E</text>
<rect x="73" y="143" width="34" height="5" rx="2" fill="#EF9F27" opacity="0.7"/>
<rect x="73" y="151" width="30" height="5" rx="2" fill="#D85A30" opacity="0.9"/>
<rect x="73" y="159" width="34" height="5" rx="2" fill="#EF9F27" opacity="0.5"/>
<text x="96" y="192" text-anchor="middle" font-size="10" fill="#993C1D" font-family="sans-serif">H-strokes</text>

<!-- Q -->
<rect x="130" y="128" width="52" height="52" rx="5" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
<text x="156" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#633806" font-family="sans-serif">Q</text>
<!-- tail highlight -->
<ellipse cx="162" cy="165" rx="6" ry="4" fill="#D85A30" opacity="0.8"/>
<text x="156" y="192" text-anchor="middle" font-size="10" fill="#993C1D" font-family="sans-serif">tail stroke</text>

<!-- R -->
<rect x="190" y="128" width="52" height="52" rx="5" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
<text x="216" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#633806" font-family="sans-serif">R</text>
<!-- leg highlight -->
<line x1="209" y1="158" x2="225" y2="172" stroke="#D85A30" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
<text x="216" y="192" text-anchor="middle" font-size="10" fill="#993C1D" font-family="sans-serif">leg stroke</text>

<!-- how it works -->
<rect x="248" y="128" width="62" height="52" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="279" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#712B13" font-family="sans-serif">How it works</text>
<text x="279" y="154" text-anchor="middle" font-size="9" fill="#993C1D" font-family="sans-serif">Gradient of</text>
<text x="279" y="164" text-anchor="middle" font-size="9" fill="#993C1D" font-family="sans-serif">class score</text>
<text x="279" y="174" text-anchor="middle" font-size="9" fill="#993C1D" font-family="sans-serif">→ last conv</text>
<text x="279" y="192" text-anchor="middle" font-size="10" fill="#993C1D" font-family="sans-serif">heatmap</text>

<!-- key finding -->
<rect x="10" y="204" width="300" height="12" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="160" y="210" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#712B13" font-family="sans-serif">Model focuses on discriminative stroke regions — not background</text>
</svg>
