<svg width="100%" viewBox="0 0 320 290" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Panel 4 — Custom CNN architecture</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
</marker>
</defs>

<!-- background -->
<rect x="4" y="4" width="312" height="282" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>

<!-- header -->
<rect x="4" y="4" width="312" height="36" rx="12" fill="#534AB7"/>
<rect x="4" y="28" width="312" height="12" fill="#534AB7"/>
<circle cx="24" cy="22" r="12" fill="#3C3489"/>
<text x="24" y="22" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="white" font-family="sans-serif">4</text>
<text x="165" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="white" font-family="sans-serif">Custom CNN (Baseline)</text>

<!-- ══════════════════════════════════════════════════
     ARCHITECTURE ROW
     Each conv block: 54px wide, head: 62px wide
     Gaps of 8px between elements
     Layout: input(10-51) gap arrow block1(60-113) arrow block2(122-175) arrow block3(184-237) arrow head(246-307)
     All blocks y=46..130 (84px tall: 62px conv rect + 20px pool rect + 2px gap)
     ══════════════════════════════════════════════════ -->

<!-- INPUT BOX — 40×40, centred label -->
<rect x="10" y="52" width="40" height="40" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="30" y="72" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#534AB7" font-family="sans-serif">A</text>
<!-- "28×28" below box, 8px gap -->
<text x="30" y="100" text-anchor="middle" font-size="9" fill="#3C3489" font-family="sans-serif">28×28 px</text>

<!-- arrow: input → block1 -->
<line x1="50" y1="72" x2="58" y2="72" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ── BLOCK 1: Conv32 (54px wide) ── -->
<!-- conv rect y=52..113 (62px) -->
<rect x="60" y="52" width="54" height="62" rx="4" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
<!-- 3 text lines: title at y=66, line1 at y=79, line2 at y=92 — 13px spacing, font-size=8 -->
<text x="87" y="66" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="#26215C" font-family="sans-serif">Conv2D</text>
<text x="87" y="79" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#3C3489" font-family="sans-serif">32 filters</text>
<text x="87" y="92" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#3C3489" font-family="sans-serif">3×3  ReLU</text>
<!-- maxpool bar y=116..133 (2px gap below conv rect) -->
<rect x="60" y="116" width="54" height="16" rx="3" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
<text x="87" y="124" text-anchor="middle" dominant-baseline="central" font-size="8" fill="white" font-family="sans-serif">MaxPool 2×2</text>
<!-- size label y=138, 5px below pool bar -->
<text x="87" y="138" text-anchor="middle" font-size="8" fill="#534AB7" font-family="sans-serif">14×14×32</text>

<!-- arrow: block1 → block2 -->
<line x1="114" y1="82" x2="122" y2="82" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ── BLOCK 2: Conv64 ── -->
<rect x="124" y="52" width="54" height="62" rx="4" fill="#7F77DD" stroke="#534AB7" stroke-width="0.8"/>
<text x="151" y="66" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="white" font-family="sans-serif">Conv2D</text>
<text x="151" y="79" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#EEEDFE" font-family="sans-serif">64 filters</text>
<text x="151" y="92" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#EEEDFE" font-family="sans-serif">3×3  ReLU</text>
<rect x="124" y="116" width="54" height="16" rx="3" fill="#534AB7" stroke="#534AB7" stroke-width="0.5"/>
<text x="151" y="124" text-anchor="middle" dominant-baseline="central" font-size="8" fill="white" font-family="sans-serif">MaxPool 2×2</text>
<text x="151" y="138" text-anchor="middle" font-size="8" fill="#534AB7" font-family="sans-serif">7×7×64</text>

<!-- arrow: block2 → block3 -->
<line x1="178" y1="82" x2="186" y2="82" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ── BLOCK 3: Conv128 ── -->
<rect x="188" y="52" width="54" height="62" rx="4" fill="#3C3489" stroke="#534AB7" stroke-width="0.8"/>
<text x="215" y="66" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="white" font-family="sans-serif">Conv2D</text>
<text x="215" y="79" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#AFA9EC" font-family="sans-serif">128 filters</text>
<text x="215" y="92" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#AFA9EC" font-family="sans-serif">3×3  ReLU</text>
<rect x="188" y="116" width="54" height="16" rx="3" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="215" y="124" text-anchor="middle" dominant-baseline="central" font-size="8" fill="white" font-family="sans-serif">MaxPool 2×2</text>
<text x="215" y="138" text-anchor="middle" font-size="8" fill="#534AB7" font-family="sans-serif">3×3×128</text>

<!-- arrow: block3 → head -->
<line x1="242" y1="82" x2="250" y2="82" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ── CLASSIFICATION HEAD: 62px wide ──
     Needs to fit: Flatten / Dropout 0.4 / Dense 256 / Softmax 26
     At font-size=8: "Dropout 0.4" = 11 chars × ~4.5 = ~50px — fits in 62px with padding -->
<rect x="252" y="52" width="62" height="80" rx="4" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
<text x="283" y="66" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#26215C" font-family="sans-serif">Flatten</text>
<line x1="256" y1="72" x2="310" y2="72" stroke="#534AB7" stroke-width="0.5"/>
<text x="283" y="80" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#26215C" font-family="sans-serif">Dropout 0.4</text>
<line x1="256" y1="86" x2="310" y2="86" stroke="#534AB7" stroke-width="0.5"/>
<text x="283" y="94" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#26215C" font-family="sans-serif">Dense 256</text>
<line x1="256" y1="100" x2="310" y2="100" stroke="#534AB7" stroke-width="0.5"/>
<text x="283" y="110" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="500" fill="#3C3489" font-family="sans-serif">Softmax 26</text>
<text x="283" y="124" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#3C3489" font-family="sans-serif">(output)</text>

<!-- ══ PARAMS BOX — y=156..182 (18px gap from architecture row bottom ~y=138) ══ -->
<rect x="10" y="156" width="300" height="26" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="160" y="169" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3C3489" font-family="sans-serif">394,522 parameters  ·  &lt; 5 MB model file</text>

<!-- ══ RESULTS BOX — y=190..252 (8px gap below params box) ══ -->
<rect x="10" y="190" width="300" height="62" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text x="160" y="208" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Test accuracy: 99.08%</text>
<text x="160" y="226" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">Macro F1: 98.80%  ·  AUC: 1.000</text>
<text x="160" y="244" text-anchor="middle" font-size="11" fill="#0F6E56" font-family="sans-serif">All 26 letter classes  F1 &gt; 0.96</text>
</svg>
