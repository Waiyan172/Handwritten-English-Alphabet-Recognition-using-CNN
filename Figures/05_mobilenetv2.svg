<svg width="100%" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Panel 5 — MobileNetV2 transfer learning</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
</marker>
</defs>
<rect x="4" y="4" width="312" height="212" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<rect x="4" y="4" width="312" height="36" rx="12" fill="#534AB7"/>
<rect x="4" y="28" width="312" height="12" fill="#534AB7"/>
<circle cx="24" cy="22" r="12" fill="#3C3489"/>
<text x="24" y="22" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="white" font-family="sans-serif">5</text>
<text x="165" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="white" font-family="sans-serif">MobileNetV2 Transfer Learning</text>

<!-- ImageNet source box -->
<rect x="10" y="48" width="88" height="60" rx="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
<text x="54" y="64" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C" font-family="sans-serif">ImageNet</text>
<text x="54" y="78" text-anchor="middle" font-size="10" fill="#3C3489" font-family="sans-serif">1.28M colour</text>
<text x="54" y="90" text-anchor="middle" font-size="10" fill="#3C3489" font-family="sans-serif">photographs</text>

<!-- arrow to base -->
<line x1="98" y1="78" x2="112" y2="78" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- MobileNetV2 base (frozen then fine-tune) -->
<rect x="114" y="48" width="90" height="60" rx="6" fill="#7F77DD" stroke="#534AB7" stroke-width="0.8"/>
<text x="159" y="64" text-anchor="middle" font-size="11" font-weight="500" fill="white" font-family="sans-serif">MobileNetV2</text>
<text x="159" y="78" text-anchor="middle" font-size="10" fill="#EEEDFE" font-family="sans-serif">base (frozen)</text>
<text x="159" y="90" text-anchor="middle" font-size="10" fill="#EEEDFE" font-family="sans-serif">3.4M params</text>

<!-- arrow to head -->
<line x1="204" y1="78" x2="218" y2="78" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- new head -->
<rect x="220" y="48" width="88" height="60" rx="6" fill="#3C3489" stroke="#534AB7" stroke-width="0.8"/>
<text x="264" y="62" text-anchor="middle" font-size="10" font-weight="500" fill="white" font-family="sans-serif">GAP</text>
<line x1="228" y1="68" x2="300" y2="68" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="264" y="76" text-anchor="middle" font-size="10" fill="#AFA9EC" font-family="sans-serif">Dropout 0.4</text>
<line x1="228" y1="82" x2="300" y2="82" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="264" y="90" text-anchor="middle" font-size="10" fill="#AFA9EC" font-family="sans-serif">Dense 256</text>
<text x="264" y="100" text-anchor="middle" font-size="9" fill="#AFA9EC" font-family="sans-serif">Softmax 26</text>

<!-- training stages -->
<rect x="10" y="118" width="300" height="22" rx="5" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="160" y="129" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3C3489" font-family="sans-serif">Stage 1: freeze base · train head · 5 epochs · lr=1e-3</text>
<rect x="10" y="144" width="300" height="22" rx="5" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="160" y="155" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3C3489" font-family="sans-serif">Stage 2: unfreeze top 30 layers · fine-tune · lr=1e-5</text>

<!-- domain mismatch warning -->
<rect x="10" y="174" width="300" height="36" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<polygon points="28,200 38,182 48,200" fill="#D85A30" opacity="0.8"/>
<text x="38" y="194" text-anchor="middle" font-size="14" font-weight="500" fill="white" font-family="sans-serif">!</text>
<text x="175" y="188" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13" font-family="sans-serif">Domain mismatch: colour photos ≠ grayscale letters</text>
<text x="175" y="202" text-anchor="middle" font-size="11" fill="#993C1D" font-family="sans-serif">Result: 19.59% accuracy  (transfer learning fails here)</text>
</svg>
